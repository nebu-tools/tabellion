[package]
name = "tabellion-r"
description = "R interface to Word documents, through extendr"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-only"
repository = "https://github.com/nebu-tools/tabellion"

[lib]
crate-type = ["staticlib", "rlib"]
name = "tabellion"

[dependencies]
nebu-docx = { path = "../../../../crates/nebu-docx" }
tabellion-typst = { path = "../../../../crates/tabellion-typst" }
thiserror = "2"
extendr-api = "0.8"
extendr-ffi = "0.8"

[dev-dependencies]
tempfile = "3.27"
