[workspace]
resolver = "3"
members = ["crates/nebu-docx", "crates/tabellion", "crates/tabellion-typst"]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-only"
repository = "https://github.com/nebu-tools/tabellion"

[workspace.dependencies]
nebu-docx = { path = "crates/nebu-docx" }
zip = { version = "9.7", default-features = false, features = ["deflate-flate2-zlib-rs"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
crc32fast = "1.5"
clap = { version = "4.6", features = ["derive"] }
proptest = "1.12"
roxmltree = "0.21"
regex = { version = "1", default-features = false, features = ["std", "unicode-perl"] }
tempfile = "3.27"
