name: G-BA templates

# Fails when the G-BA page no longer links a template from templates.csv.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6"
      - run: sudo apt-get install -y libxml2-dev
      - name: Install rv
        run: |
          curl -sSfL https://raw.githubusercontent.com/A2-ai/rv/refs/heads/main/scripts/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: rv sync
      - run: rv run gba.R fetch
      - run: rv run gba.R check-templates
