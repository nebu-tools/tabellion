name: R dependencies

# Dependabot does not support rv, so this job updates rv.lock and opens a PR.
on:
  schedule:
    - cron: "0 6 * * 2"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6"
      - run: sudo apt-get install -y libxml2-dev libcurl4-openssl-dev libssl-dev
      - name: Install rv
        run: |
          curl -sSfL https://raw.githubusercontent.com/A2-ai/rv/refs/heads/main/scripts/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: rv upgrade
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: update-r-dependencies
          commit-message: Update R dependencies
          title: Update R dependencies
          body: Weekly `rv upgrade`.
          add-paths: rv.lock
