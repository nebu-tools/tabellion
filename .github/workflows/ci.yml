name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      TYPST_VERSION: 0.15.1
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6"
      - name: Install system libraries
        run: sudo apt-get install -y libxml2-dev libcurl4-openssl-dev libssl-dev
      - name: Install rv
        run: |
          curl -sSfL https://raw.githubusercontent.com/A2-ai/rv/refs/heads/main/scripts/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install Typst
        run: |
          curl -sSfL "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" | tar -xJ --strip-components=1 -C "$HOME/.local/bin" --wildcards '*/typst'
      - uses: actions/cache@v4
        with:
          path: rv/library
          key: rv-${{ runner.os }}-${{ hashFiles('rv.lock') }}
      - uses: actions/cache@v4
        with:
          path: templates
          key: templates-${{ hashFiles('templates.csv') }}
      - run: rv sync
      - run: rv run gba.R fetch
      - run: rv run tests/testthat.R
      - name: Compile the Typst preview of a generated project
        run: |
          rv run gba.R import modul4 /tmp/preview
          typst compile /tmp/preview/2025-11-18_Anl2_6_Modul4.typ /tmp/preview/preview.pdf
