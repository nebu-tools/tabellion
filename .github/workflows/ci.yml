name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: tools/xmlconf.sh

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
      # tabellion-r links R, and R ships no MSVC import library, so its
      # test binary cannot link on Windows. Its logic is covered on the
      # other runners and by the R job; Windows R support (Makevars.win)
      # is a follow-up.
      - run: cargo test --all-targets
        if: matrix.os != 'windows-2025'
      - run: cargo test --workspace --exclude tabellion-r --all-targets
        if: matrix.os == 'windows-2025'
      - run: cargo test --doc --workspace --exclude tabellion-r
        if: matrix.os == 'windows-2025'
      - run: cargo test --doc
        if: matrix.os != 'windows-2025'

  r:
    # The R package: install and check it on Linux.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      # Headers for the source installs of testthat's and curl's dependencies.
      - run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libuv1-dev
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: r/tabellion/src/rustlib
      - run: Rscript -e 'install.packages(c("testthat", "curl"), repos = "https://cloud.r-project.org")'
      - run: R CMD check r/tabellion --no-manual --no-vignettes

  fuzz:
    # Every fuzz target for a short time, from seeds of the corpus.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install nightly --profile minimal && rustup default nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      - name: Run each target for 30 seconds
        working-directory: fuzz
        run: |
          mkdir -p corpus/open corpus/views corpus/content
          cp ../samples/report-template.docx corpus/open/
          for f in ../corpus/*.docx; do { printf '\0'; cat "$f"; } > "corpus/views/$(basename "$f")"; done
          cp ../samples/survey.json corpus/content/
          for t in xml edit open views content write; do
            cargo fuzz run "$t" -- -max_total_time=30
          done
